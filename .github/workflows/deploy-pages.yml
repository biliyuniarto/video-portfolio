name: Deploy video portfolio to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio source
        uses: actions/checkout@v4

      - name: Assemble the static portfolio
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html styles.css script.js favicon.svg robots.txt sitemap.xml .nojekyll _site/
          cp ./*.mp4 ./*.webp bili-video-portfolio-qr.png _site/

          test "$(find _site -maxdepth 1 -name '*.mp4' | wc -l)" -eq 6
          test "$(find _site -maxdepth 1 -name '*.webp' | wc -l)" -eq 6
          test -s _site/bili-video-portfolio-qr.png

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
